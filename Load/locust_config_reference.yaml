############################################################################
# FULL REFERENCE CONFIG for Test_Locust.py
#
# This file demonstrates every feature the engine supports, with inline
# explanations. It is not meant to be run as-is (some paths/values are
# placeholders) — copy the sections you need into your real config.
############################################################################

# --------------------------------------------------------------------------
# GLOBAL SETTINGS
# --------------------------------------------------------------------------

# Default base URL, used by any user class that doesn't set its own "host:".
# All "endpoint" values below are appended to whichever host applies.
#
# MULTI-HOST SUPPORT: you don't have to test a single service. Two levels
# of override are available:
#   1. Per-user-class: set "host:" directly under a user in "users:" below
#      to point that whole user class at a different service (e.g. testing
#      an orders service and a catalog service in the same run).
#   2. Per-step: set "host:" directly on an individual task or subtask to
#      send just that one request elsewhere (e.g. an auth call to a
#      separate auth microservice before the rest of a flow continues
#      against the main API). Step-level "host:" also supports "{{var}}"
#      placeholders from user_context, just like "endpoint".
# If a user class has no host anywhere (no global host, no user-level
# host), every one of its tasks/subtasks MUST set its own step-level host
# — the engine validates this at startup and fails fast with a clear error
# instead of letting Locust fail mid-test on the first request.
host: "https://api.example.com"

# Optional. Not read directly by the script's logic — it exists so you can
# define a YAML anchor (&name) here and reuse the value elsewhere (e.g. in
# a header) via an alias (*name). See "sxsrf" header below for an example.
api_key: &shared_token "REPLACE_WITH_YOUR_VALUE"

# --------------------------------------------------------------------------
# LOGGING (optional)
# --------------------------------------------------------------------------
# Controls the engine's own logger (separate from Locust's own --loglevel/
# --logfile, which still govern Locust's framework messages). Both default
# to sensible values if omitted entirely.

# DEBUG | INFO | WARNING | ERROR | CRITICAL. Default: "INFO".
#   DEBUG   -> also shows full per-request/response dumps (print_request/
#              print_response below), successful ("OK") requests, CSV row
#              picks, and successful extracts. Verbose — use for
#              troubleshooting a single scenario, not a full-scale run.
#   INFO    -> setup/lifecycle messages only (CSVs loaded, shape
#              registered, run_once completion, etc.) plus anything WARNING
#              or above. This is the right level for real load test runs.
#   WARNING -> only recoverable per-request problems (missing files, failed
#              extracts, skipped requests, questionable config).
#   ERROR   -> only failed HTTP requests (non-2xx/3xx responses).
# Note: print_request / print_response on a step are ALSO required for that
# step's debug dump to appear — the two controls combine, so a step can be
# left with print_request: true "for later" without spamming a normal INFO
# run; nothing shows until log_level: DEBUG.
log_level: "INFO"

# Optional. If set, log messages are also written to this file (in addition
# to the normal console output). Useful for keeping a permanent record of
# a CI/CD load test run without scrolling back through console history.
# log_file: "locust_engine.log"

# --------------------------------------------------------------------------
# SETUP / TEARDOWN HOOKS (optional)
# --------------------------------------------------------------------------
# Run ONCE for the whole test — not once per user. Each step uses the exact
# same schema as a normal task/subtask step (method, endpoint, host,
# headers, payload | payload_from_file | payload_from_csv, extract, if,
# print_request/print_response, continue_on_failure). "{{var}}" placeholder
# substitution works the same way too.
#
# "setup:" runs before any users are spawned. Typical use: log in once and
# extract a shared token so individual users don't each need their own
# login step. Anything captured via "extract" here (e.g. "shared_token"
# below) is automatically copied into EVERY user's own context when that
# user starts — reference it in any task/subtask exactly like a normal
# extracted or CSV value: "{{shared_token}}".
#
# A failing setup step ABORTS the whole run before any load is generated
# (add "continue_on_failure: true" on a specific step if it's fine for
# that one to fail without stopping the test).
setup:
  - method: POST
    endpoint: "/auth/api/v1/login"
    payload:
      username: "loadtest_user"
      password: "REPLACE_WITH_YOUR_VALUE"
    extract:
      - from: "json"
        field: "data.token"
        save_as: "shared_token"

# "teardown:" runs once after the test stops (run-time expiry, web UI
# stop, or Ctrl+C). Typical use: delete data created during the run, or
# ping a webhook that the run finished. Teardown is always BEST-EFFORT —
# a failing step is logged and the next teardown step still runs
# regardless of continue_on_failure, so cleanup gets as far as it can.
teardown:
  - method: POST
    endpoint: "/testdata/api/v1/cleanup"
    headers:
      authorization: "Bearer {{shared_token}}"

# --------------------------------------------------------------------------
# GLOBAL CSV (typically used for auth tokens / per-user identity)
# --------------------------------------------------------------------------

# Master switch for the global CSV feature below. If false, csv_file /
# csv_mode / csv_column are ignored entirely.
use_csv: true

# One or more CSV files, all loaded and concatenated into a single pool of
# rows (csv_data). Can be a single string instead of a list.
csv_file:
  - "tokenV1.csv"
  # - "tokenV2.csv"   # multiple files are merged together

# How rows are picked from that pool each time they're needed:
#   "sequential" -> round-robin via itertools.cycle (deterministic, repeats)
#   "random"     -> random.choice (default if omitted)
# NOTE: this also now governs payload_from_csv selection (see below) —
# both the token CSV and any payload CSV honor this same setting.
csv_mode: "sequential"

# Which column(s) from the CSV row get copied into a user's context (and
# therefore become available as {{ColumnName}} placeholders). Can be a
# single string instead of a list.
csv_column:
  - "Token"
  # - "CustomerId"

# --------------------------------------------------------------------------
# GLOBAL VALUE TRANSFORMS
# --------------------------------------------------------------------------
# Applied to every value pulled from a CSV row (global CSV or a per-task/
# per-subtask "CSV_file") before it's stored in context. All optional.
transform:
  trim: true                       # strip leading/trailing whitespace (default true)
  replace_spaces_with: "_"         # e.g. "New York" -> "New_York"
  lowercase: false                 # lowercase the value
  suffix: ""                       # append a fixed string to every value

# --------------------------------------------------------------------------
# USERS
# --------------------------------------------------------------------------
users:

  # ==========================================================================
  # EXAMPLE 1: Sequential user (a fixed, ordered flow — e.g. checkout funnel)
  # ==========================================================================
  - name: Customer_Type_A
    weight: 6                      # relative proportion of this user class vs others
    wait_time: [1, 8]               # random think-time in seconds between tasks, [min, max]
    sequential: true                # tasks run in the exact order listed below

    # Optional (default "per_iteration"). Controls how a global-CSV row
    # (e.g. Token) is assigned to THIS user class:
    #   "per_iteration" -> a fresh row is pulled from the shared pool every
    #                      time the task sequence loops (default, original
    #                      behavior)
    #   "per_user"      -> one row is picked once when the virtual user
    #                      starts and stays fixed ("sticky") for its whole
    #                      session/lifetime
    csv_scope: "per_iteration"

    # Optional (default false). If true, once this user finishes the LAST
    # task in "tasks" (below), it raises StopUser() and stops — it will NOT
    # loop back to task 1. Without this, a sequential user's task list
    # repeats forever until Locust itself decides to kill the user.
    run_once: false

    tasks:

      # A "task" with a "subtasks" list = a multi-step chained flow that
      # runs as one unit (e.g. place order -> pay for order), sharing the
      # SAME user_context so later steps can use values extracted earlier.
      - name: "Place Order And Payment"
        weight: 3                   # only used for NON-sequential users; ignored here

        # Optional: per-TASK CSV, applies to every subtask in this task
        # unless a subtask defines its own CSV_file. Rows are picked with
        # random.choice (NOT affected by the global csv_mode).
        # CSV_file: "task_level_data.csv"

        subtasks:

          # ---- Subtask 1: create the order --------------------------------
          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"

            # Optional: request_name groups this call under one label in
            # Locust's stats (useful when endpoint has dynamic parts).
            request_name: "Place Order"

            # Optional: per-SUBTASK CSV — overrides the task-level CSV_file
            # for just this subtask. Rows picked via random.choice.
            # CSV_file: "subtask_level_data.csv"

            # payload_from_csv: pulls a row from order_payloads.csv, reads
            # the "payload" column from that row, and treats THAT value as
            # a *path to a JSON file* whose contents become the request
            # body (placeholders inside that JSON file are substituted).
            # Row selection now honors the global csv_mode: "sequential" or
            # "random" — previously this was always random regardless of
            # csv_mode.
            payload_from_csv:
              file: "order_payloads.csv"
              column: "payload"
            # Shorthand form (same as above with column defaulting to
            # "payload"): payload_from_csv: "order_payloads.csv"

            headers:
              Content-Type: "application/json"
              authorization: "Bearer {{Token}}"     # {{Token}} filled from global CSV
              sxsrf: *shared_token                  # YAML alias reusing api_key above

            params:                                  # optional query string params
              debug: "false"

            print_response: true    # log full response body — turn OFF for real load runs
            print_request: true     # log full request details — turn OFF for real load runs

            # Extracts a value from the JSON response and stores it in
            # user_context as "order_id", so later steps can reference
            # {{order_id}}. "field" supports dotted/bracket paths, e.g.
            # "data.order.id" or "data.items[0].id".
            extract:
              - from: "json"
                field: "data"
                save_as: "order_id"
              # - from: "headers"
              #   field: "X-Request-Id"
              #   save_as: "request_id"

            # Optional (default false). If this subtask fails (bad HTTP
            # status OR a declared "extract" value wasn't found), the
            # engine stops running the REST of this task's subtasks by
            # default. Set continue_on_failure: true to run subsequent
            # subtasks anyway even if this one fails.
            continue_on_failure: false

          # ---- Subtask 2: pay for the order just created -------------------
          - method: POST
            endpoint: "/oms/api/v1/order/order-payment-status-update"
            request_name: "Confirm Payment"

            # Inline payload (as opposed to payload_from_file/payload_from_csv).
            # {{order_id}} is substituted from what subtask 1 extracted.
            # If subtask 1 failed above (and continue_on_failure wasn't
            # set), this subtask is now SKIPPED entirely rather than
            # firing with a stale/old order_id.
            payload:
              orderReferenceId: "{{order_id}}"
              paymentMode: 0
              paymentStatus: 1
              paymentInfo:
                isCodOrder: true
                CodCharge: 10

            headers:
              Content-Type: "application/json"
              authorization: "Bearer {{Token}}"
              sxsrf: *shared_token

            print_response: true
            print_request: true

            # Extracted here so the branching example below (EXAMPLE 3) can
            # use it — extract works the same on any subtask, not just the
            # first one in a chain.
            extract:
              - from: "json"
                field: "data.paymentStatus"
                save_as: "payment_status"

      # ==========================================================================
      # EXAMPLE 3 (CONDITIONAL / BRANCHING FLOW): pick ONE subtask chain to
      # run based on a value already in user_context (here, "payment_status"
      # extracted by the task above). Use "branches:" INSTEAD OF "subtasks:"
      # on a task — the two are mutually exclusive.
      #
      # Branches are evaluated top-to-bottom; the FIRST branch whose "if:"
      # is true (or that has no "if:" at all — the default/else, which
      # should be listed LAST) has its "subtasks:" run, exactly like a
      # normal chained task. If nothing matches and there's no default,
      # nothing runs this iteration (not treated as a failure).
      - name: "Handle Payment Result"
        branches:
          - if:
              var: payment_status
              op: equals
              value: "failed"
            subtasks:
              - method: POST
                endpoint: "/oms/api/v1/refund/initiate"
                payload:
                  orderReferenceId: "{{order_id}}"

          - if:
              var: payment_status
              op: equals
              value: "pending"
            subtasks:
              - method: GET
                endpoint: "/oms/api/v1/payment/poll"
                params:
                  orderReferenceId: "{{order_id}}"

          # Default/else branch: no "if:", must be last. Runs when
          # payment_status is anything other than "failed" or "pending"
          # (e.g. "confirmed").
          - subtasks:
              - method: POST
                endpoint: "/oms/api/v1/shipping/schedule"
                payload:
                  orderReferenceId: "{{order_id}}"

                # A single subtask INSIDE a branch can also have its own
                # "if:" to skip just that one request — e.g. only notify
                # if this customer opted in, still shipping either way.
                # (Shown here for illustration; delete if not needed.)
              - method: POST
                endpoint: "/notifications/api/v1/send"
                if:
                  var: notify_opt_in
                  op: equals
                  value: "true"
                payload:
                  orderReferenceId: "{{order_id}}"
                  message: "Your order has shipped!"

  # ==========================================================================
  # EXAMPLE 2: Non-sequential user (probabilistic task mix, classic Locust)
  # ==========================================================================
  - name: Customer_Type_B
    weight: 2
    wait_time: [2, 5]
    sequential: false               # each task below runs independently, picked
                                     # by Locust using normal weighted-random selection
    # csv_scope / run_once are only meaningful for sequential: true users
    # and are ignored here.

    # MULTI-HOST EXAMPLE (per-user override): this user class targets the
    # catalog service instead of the global "host" above. Every task below
    # that doesn't set its own "host:" will use this one.
    host: "https://catalog.example.com"

    tasks:

      # A task with NO "subtasks" key is itself a single request step —
      # all the same fields as a subtask (method, endpoint, payload,
      # headers, extract, etc.) apply directly here.
      - name: "Browse Product List"
        weight: 5                   # relative chance vs this user's other tasks
        method: GET
        endpoint: "/catalog/api/v1/products"
        headers:
          authorization: "Bearer {{Token}}"
        print_response: false
        print_request: false

      - name: "Search Products"
        weight: 3
        method: GET
        endpoint: "/catalog/api/v1/search"
        params:
          q: "shoes"
          page: 1
        headers:
          authorization: "Bearer {{Token}}"

        # RATE LIMITING EXAMPLE (shorthand): caps this step at 20 requests/
        # sec TOTAL, shared across every concurrent user hitting it — NOT
        # 20/sec per user. Useful for hitting a downstream dependency (a
        # third-party API, a rate-limited gateway) at a known-safe pace
        # regardless of how many virtual users the run is configured with.
        # Shorthand for {rate: 20, per: "second"}.
        #
        # CAVEAT: the limiter lives in-process. In a single (standalone)
        # `locust` run this IS a true global cap. In distributed mode
        # (--master/--worker), each worker process has its OWN limiter, so
        # the actual combined rate across the whole run is (this number ×
        # number of workers) — divide accordingly if you need a hard total
        # across a distributed run.
        rate_limit: 20

      # MULTI-HOST EXAMPLE (per-step override): this single task hits a
      # separate recommendations service, overriding the user-level host
      # above just for this one request. Supports "{{var}}" placeholders
      # too, e.g. host: "https://{{region}}-recs.example.com".
      - name: "Fetch Recommendations"
        weight: 2
        method: GET
        endpoint: "/api/v1/recommendations"
        host: "https://recs.example.com"
        headers:
          authorization: "Bearer {{Token}}"

        # RATE LIMITING EXAMPLE (full form + sharing): full-form syntax
        # lets you express the limit per minute/hour instead of per
        # second, and "name:" lets two DIFFERENT steps/tasks share ONE
        # limiter — e.g. if both this step and some other task also hit
        # the recommendations service and together must stay under a
        # combined 100/min, give both the same "name:" here. Every step/
        # task sharing a name MUST use the same rate/per — mismatches are
        # only warned about, not rejected (the first one registered wins).
        rate_limit:
          rate: 100
          per: "minute"
          name: "recommendations_service"

      # payload_from_file: reads a static JSON file from disk (with
      # placeholder substitution) as the request body — use this when the
      # body doesn't need to vary per request/row.
      - name: "Submit Static Feedback"
        weight: 1
        method: POST
        endpoint: "/feedback/api/v1/submit"
        payload_from_file: "static_feedback_payload.json"
        headers:
          Content-Type: "application/json"
          authorization: "Bearer {{Token}}"

      # File upload example: multipart form-data with attached file(s),
      # optionally combined with additional form fields and/or a JSON
      # payload (JSON keys get merged into the form; a colliding key name
      # is stored as "json_<key>" to avoid overwriting the form field).
      - name: "Upload Profile Picture"
        weight: 1
        method: POST
        endpoint: "/profile/api/v1/avatar"
        headers:
          authorization: "Bearer {{Token}}"
        form:
          userId: "{{CustomerId}}"
        files:
          - field: "avatar"
            path: "assets/sample_avatar.jpg"
            mime: "image/jpeg"

# --------------------------------------------------------------------------
# CUSTOM LOAD SHAPE (optional)
# --------------------------------------------------------------------------
# By default, Locust just spawns users up to a flat target count using
# -u/-r (or the "weight" fields above). If you instead want a custom ramp
# pattern over time (spikes, staged ramp-up, soak tests, etc.), add a
# "shape:" block. When present, the engine builds a Locust LoadTestShape
# automatically — you don't write any shape Python yourself.
#
# IMPORTANT: when a shape is defined, Locust hides the -u/-r/-t CLI options
# by default — the shape fully controls user count and spawn rate for the
# whole run. Set "use_common_options: true" below if you still want
# --run-time (-t) to apply as a hard cap on top of the shape.
shape:
  type: stages              # only "stages" is currently supported

  # Optional (default false). If true, once the run time passes the last
  # stage's "duration", the shape loops back to stage 1 instead of ending
  # the test — useful for long soak/pulse tests. If false (default), the
  # test stops automatically once the last stage's duration has elapsed.
  loop: false

  # Optional (default false). See note above.
  use_common_options: false

  # Ordered list of ramp stages. "duration" is CUMULATIVE seconds from the
  # start of the test (not the length of that individual stage) — e.g. the
  # stage below with duration: 300 is active from t=120s to t=300s.
  # Stages MUST have strictly increasing "duration" values.
  stages:
    - duration: 60           # from t=0s to t=60s
      users: 10               # target concurrent user count during this stage
      spawn_rate: 10          # users/sec spawn rate while ramping to that target
      # Optional: restrict this stage to specific user classes only (must
      # match a "name:" under "users:" above). Omit to spawn from ALL
      # defined user classes (Locust's normal default weighting applies).
      user_classes: ["Customer_Type_A"]

    - duration: 180          # from t=60s to t=180s
      users: 50
      spawn_rate: 10
      # no user_classes -> all defined users participate, per their weights

    - duration: 300          # from t=180s to t=300s (test ends here unless loop: true)
      users: 100
      spawn_rate: 10

############################################################################
# QUICK FIELD REFERENCE
#
# TOP LEVEL: host, api_key, log_level, log_file, setup, teardown, use_csv, csv_file, csv_mode, csv_column, transform, users, shape
#
# SETUP / TEARDOWN (optional, top-level "setup:"/"teardown:"): list of steps
#   using the SAME schema as STEP below. Run once for the whole test (not
#   per user) via Locust's test_start/test_stop events. "setup:" extracts
#   are copied into every user's context on start; a failing required setup
#   step aborts the run before load begins. "teardown:" always runs every
#   step best-effort regardless of failures.
#
# USER: name, weight, wait_time [min,max], sequential, csv_scope, run_once, host (optional,
#       overrides top-level "host" for this whole user class), tasks
#
# TASK: name, weight (non-sequential only), CSV_file (optional), if (optional,
#       gates the WHOLE task — see CONDITIONS below), rate_limit (optional —
#       see RATE LIMIT below; on a subtasks/branches task, gates the WHOLE
#       chain as one unit, not each subtask individually), EXACTLY ONE of:
#         - subtasks (chained flow), OR
#         - branches (conditional flow — list of {if (optional; omit for the
#           default/else, which must be last), subtasks}, first match wins), OR
#         - neither (the task itself is a single request step, fields below)
#
# STEP (task-without-subtasks/branches OR any item inside subtasks/branches[].subtasks):
#   method, endpoint, request_name, headers, params, form, files,
#   host (optional, overrides user-level/global host for just this one request;
#   supports "{{var}}" placeholders),
#   if (optional — false SKIPS just this one step, not a failure, chain continues),
#   rate_limit (optional — see RATE LIMIT below),
#   payload | payload_from_file | payload_from_csv (file/column or shorthand string),
#   print_request, print_response, extract [{from: json|headers, field, save_as}],
#   continue_on_failure, CSV_file (optional, subtask-level)
#
# RATE LIMIT ("rate_limit:", on a TASK or any STEP): caps how often that
#   thing fires GLOBALLY across every concurrent user (per-process only —
#   see CAVEAT in the "Rate limiting per task/step" section above for
#   distributed --master/--worker runs). Shorthand: rate_limit: 10 (10/sec).
#   Full form: {rate: 10, per: second|minute|hour}. Add "name: some_label"
#   to make two different steps/tasks share ONE combined limiter instead of
#   each getting its own independent one.
#
# CONDITIONS ("if:", used by TASK.if, STEP.if, and branches[].if): reads
#   from user_context (CSV columns + prior "extract" results). Either:
#     {var: name, op: <op>, value: <v>}   — value omitted for exists/not_exists
#   or a combinator: {all: [cond, ...]} / {any: [cond, ...]} / {not: cond}
#   ops: equals, not_equals, exists, not_exists, contains, not_contains,
#        gt, lt, gte, lte, in, not_in (in/not_in take a list for "value")
#   A comparison against a var that was never set evaluates to false rather
#   than erroring.
#
# PLACEHOLDERS: any "{{name}}" in endpoint/headers/params/payload/form/files.path
#   is substituted from that user's user_context — populated by: global CSV
#   columns, task/subtask-level CSV_file columns, and prior steps' "extract".
#
# SHAPE (optional, top-level "shape:"): type ("stages" only for now), loop,
#   use_common_options, stages [{duration (cumulative seconds), users,
#   spawn_rate, user_classes (optional, list of user "name" values)}].
#   When present, -u/-r/-t are ignored unless use_common_options: true.
############################################################################

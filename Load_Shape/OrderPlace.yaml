host: "https://pre-prod-api.cartup.com"

api_key: &reqres_key "WlhsS2VWbFhOV3RpTWpCcFQycEJkVTVVYTNkT2FrbDZUbnBuZVU1VVdUUk5SRTF6U1c1T2NGb3lOR2xQYVVsNVRVUlZNRTlYV21wWlZFWnFXWHBCZUZwcWF6RmFiVnBzV1hwVk5WbHRTVFJOUkZGNFRsUkNhMDFxVlhkT1YwbDZUVVJzYWs5RVNURmFSRWw1V2tSUk1FNUVSbWhaZWtacldrZFZORTlVV1hsUFZFWnNTV2wzYVZwWWFIZGhXRXBzWTNsSk5rMVVZekpOZWsweVRrUk5NRTR6TUQwPQ=="

use_csv: true
csv_file:
  - "token.csv"
  
csv_mode: "random"


csv_column:
  - "Token"


users:
  - name: Customer_Type_A
    weight: 6
    wait_time: [1, 3]
    sequential: true

    tasks:

      - name: "Place Order And Payment"
        weight: 3
        subtasks:

          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_csv:
              file: "order_payloads.csv"
              column: "payload"
            headers:
              Content-Type: "application/json"
              authorization: "Bearer {{Token}}"
              sxsrf: *reqres_key
            print_response: false
            print_request: false
            extract:
              - from: "json"
                field: "data"
                save_as: "order_id"

          - method: POST
            endpoint: "/oms/api/v1/order/order-payment-status-update"
            payload:
              orderReferenceId: "{{order_id}}"
              paymentMode: 0
              paymentStatus: 1
            headers:
              Content-Type: "application/json"
              authorization: "Bearer {{Token}}"
              sxsrf: *reqres_key
            print_response: false
            print_request: false

  - name: Customer_Type_B
    weight: 6
    wait_time: [1, 3]
    sequential: true

    tasks:

      - name: "Place Order"
        weight: 3
        subtasks:

          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_csv:
              file: "order_payloads.csv"
              column: "payload"
            headers:
              Content-Type: "application/json"
              authorization: "Bearer {{Token}}"
              sxsrf: *reqres_key
            print_response: false
            print_request: false     
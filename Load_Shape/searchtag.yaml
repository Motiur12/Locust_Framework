host: "https://pre-prod-api.cartup.com"
api_key: &reqres_key ""

use_csv: true
csv_mode: "random" 


csv_file:
    - "C:/Users/motiurrahman/Desktop/Data Driven Locust/Load_Shape/token.csv"

csv_column: ["Token"]    # list of CSV columns to read    # "random" or "sequential"
users:
  - name: customer
    sequential: true
    
    weight: 6
    wait_time: [1, 3]
    sequential: true

    tasks:
      - name: "Product-COD"
        weight: 1
        subtasks:

          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_file: "payload.txt"
            headers:
              Content-Type: "application/json"
              Sxsrf: *reqres_key
              Authorization: "Bearer {{Token}}"
            extract:
              - from: "json"
                field: "data"
                save_as: "order_id"

            print_response: true


          - method: POST
            endpoint: "/oms/api/v1/order/order-payment-status-update"
            payload:
              orderReferenceId: "{{order_id}}"
              paymentMode: 0
              paymentStatus: 1
            headers:
              Content-Type: "application/json"
              Sxsrf: *reqres_key
              Authorization: "Bearer {{Token}}"
            print_response: true
    

    
      - name: "Product-To Pay"
        weight: 1
        subtasks:

          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_file: "payload1.txt"
            headers:
              Content-Type: "application/json"
              Sxsrf: *reqres_key
              Authorization: "Bearer {{Token}}"
            print_response: true

      - name: "Search"
        CSV_file: "C:/Users/motiurrahman/Desktop/Data Driven Locust/Load_Shape/tag1.csv"
        weight: 1
        subtasks:
          - method: GET
            endpoint: "/aes/api/v1/products/search?keyword={{Keyword}}&sorting=0&rowsPerPage=30&currentPage=1&brandSlug=&categoryName=&maximumPrice=1000000&minimumPrice=0&rating=0"
            headers:
              Content-Type: "application/json"
              Sxsrf: *reqres_key
              Authorization: "Bearer {{Token}}"
            print_response: true

transform:
  replace_spaces_with: "+"
  #lowercase: false
  # trim: true
  # suffix: ""
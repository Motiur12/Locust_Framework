host: "https://pre-prod-api.cartup.com"
api_key: &reqres_key ""

use_csv: true
csv_mode: "random" 


#csv_file:
    #- "C:/Users/motiurrahman/Desktop/Data Driven Locust/Load_Shape/token.csv"

#csv_column: ["Token"]    # list of CSV columns to read    # "random" or "sequential"
users:
  - name: customer
    sequential: true
    
    weight: 6
    wait_time: [1, 3]
    sequential: true

    tasks:

      - name: "Login"
        CSV_file: "C:/Users/motiurrahman/Downloads/customer.csv"
        weight: 1
        subtasks:
          - method: POST
            endpoint: "https://pre-prod-be-customer.cartup.com/customer/api/v1/customer/auth/login"
            payload:
              email_or_phone: "{{Email}}"
              password: "123456Cc@"
            headers:
              Content-Type: "application/json"
            extract:
              - from: "json"             ## For extracting from response headers use "headers"
                field: "data.accessToken"
                save_as: "Token" 
            
            print_response: true

      - name: "Delivery"
        weight: 1
        subtasks:
          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_file: "payload.txt"
            headers:
              Authorization: "Bearer {{Token}}"
              Content-Type: "application/json"
              sxsrf: *reqres_key
            extract:
              - from: "json"
                field: "data"
                save_as: "OrderID"
            print_response: true

          - method: POST
            endpoint: "/oms/api/v1/order/order-payment-status-update"
            payload:
              orderReferenceId: "{{OrderID}}"
              paymentMode: 0
              paymentStatus: 1
            headers:
              Content-Type: "application/json"
              Sxsrf: *reqres_key
              Authorization: "Bearer {{Token}}"
            print_response: true


      - name: "Admin"
        CSV_file: "C:/Users/motiurrahman/Downloads/SellerId.csv"
        weight: 1
        subtasks:
          - method: GET
            endpoint: "https://pre-prod-be-admin.cartup.com/api/v1/Product/DownloadProductsExcel_local_test?sellerId={{SellerID}}&approvalStatusId=0"
            headers:
              Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..dQrMMvU5ez3wZBakTfwIEVESBR4uHGtHXRJHPu48vfk"
            print_response: true

  - name: To_Pay_Cutomer
    sequential: true
    
    weight: 6
    wait_time: [1, 3]
    sequential: true

    tasks:

      - name: "Login"
        CSV_file: "C:/Users/motiurrahman/Downloads/customer.csv"
        weight: 1
        subtasks:
          - method: POST
            endpoint: "https://pre-prod-be-customer.cartup.com/customer/api/v1/customer/auth/login"
            payload:
              email_or_phone: "{{Email}}"
              password: "123456Cc@"
            headers:
              Content-Type: "application/json"
            extract:
              - from: "json"             ## For extracting from response headers use "headers"
                field: "data.accessToken"
                save_as: "Token" 
            
            print_response: true

      - name: "To-Pay"
        weight: 1
        subtasks:
          - method: POST
            endpoint: "/oms/api/v1/orders/oc/new-order-place"
            payload_from_file: "payload.txt"
            headers:
              Authorization: "Bearer {{Token}}"
              Content-Type: "application/json"
              sxsrf: *reqres_key
            print_response: true
      
